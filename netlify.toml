# Netlify Configuration for Unity WebGL
# Provides header rules that support splats for Unity 6 builds

[[headers]]
  for = "/Build/*.br"
  [headers.values]
    Content-Encoding = "br"

[[headers]]
  for = "/Build/*.js.br"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/Build/*.wasm.br"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/Build/*.data.br"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/Build/*.gz"
  [headers.values]
    Content-Encoding = "gzip"

[[headers]]
  for = "/Build/*.js.gz"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/Build/*.wasm.gz"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/Build/*.data.gz"
  [headers.values]
    Content-Type = "application/octet-stream"
